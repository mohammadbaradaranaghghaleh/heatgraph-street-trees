# HeatGraph patch registry.
# Training/validation patches: 500 m x 500 m core + engine buffer (see engine.toml).
# Coordinates are patch CENTRES in WGS84 (lon, lat).
# status = "frozen" until the intended LCZ is checked against the Demuzere et al.
# global LCZ map and the patch is frozen. Do not train on candidate patches.

[meta]
core_size_m = 500
source_default = "3dbag"           # gold-standard heights (NL only)
canopy_source = "meta_chm_v1"
weather_source = "open_meteo_archive"   # ERA5-based, no API key
heatwave_days = ["2019-07-25", "2020-08-08", "2022-07-19"]

